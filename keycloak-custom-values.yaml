auth:
  adminPassword: Wmata1234
  adminUser: admin

global:
  security:
    allowInsecureImages: true

image:
  pullPolicy: IfNotPresent
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: latest

production: false

tls:
  enabled: false

extraVolumes:
  - name: keycloak-tls-secret
    secret:
      secretName: keycloak-tls-secret

extraVolumeMounts:
  - name: keycloak-tls-secret
    mountPath: /opt/bitnami/keycloak/certs
    readOnly: true

service:
  type: NodePort
  http:
    enabled: true
  ports:
    http: 8080
    https: 8443
  nodePorts:
    http: 30280
    https: 30281

http:
  relativePath: "/"

extraEnvVars:
  # Database Connection
  - name: KEYCLOAK_DATABASE_HOST
    value: postgresql
  - name: KEYCLOAK_DATABASE_NAME
    value: keycloak
  - name: KEYCLOAK_DATABASE_USER
    value: keycloak
  - name: KEYCLOAK_DATABASE_PASSWORD
    value: Wmata1234

  # Native Keycloak 26 (Quarkus) TLS Configuration
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: "/opt/bitnami/keycloak/certs/tls.crt"
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: "/opt/bitnami/keycloak/certs/tls.key"
  - name: KC_HTTPS_PORT
    value: "8443"

  # Proxy & Hostname settings
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "false"

livenessProbe:
  enabled: true
  failureThreshold: 12
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  failureThreshold: 12
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

postgresql:
  enabled: true
  fullnameOverride: postgresql
  auth:
    database: keycloak
    password: Wmata1234
    postgresPassword: Wmata1234
    username: keycloak
  image:
    pullPolicy: IfNotPresent
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: latest
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: nfs-client
