auth:
  adminPassword: Wmata1234
  adminUser: admin

global:
  security:
    allowInsecureImages: true

image:
  pullPolicy: IfNotPresent
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: latest

production: false

tls:
  enabled: true
  autoGenerated:
    enabled: false
  existingSecret: "keycloak-tls-secret"

service:
  type: NodePort
  ports:
    https: 8443
  nodePorts:
    https: 30280

extraEnvVars:
  - name: KEYCLOAK_DATABASE_HOST
    value: postgresql
  - name: KEYCLOAK_DATABASE_NAME
    value: keycloak
  - name: KEYCLOAK_DATABASE_USER
    value: keycloak
  - name: KEYCLOAK_DATABASE_PASSWORD
    value: Wmata1234
  - name: KEYCLOAK_PRODUCTION
    value: "true"
  - name: KEYCLOAK_ENABLE_HTTPS
    value: "true"
  - name: KEYCLOAK_HTTPS_PORT
    value: "8443"

livenessProbe:
  enabled: true
  failureThreshold: 12
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  failureThreshold: 12
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

postgresql:
  enabled: true
  fullnameOverride: postgresql
  auth:
    database: keycloak
    password: Wmata1234
    postgresPassword: Wmata1234
    username: keycloak
  image:
    pullPolicy: IfNotPresent
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: latest
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: nfs-client
