auth:
  adminUser: admin
  adminPassword: Wmata1234

global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: latest
  pullPolicy: IfNotPresent

production: true

# Fixed tls structure
tls:
  enabled: true
  autoGenerated: false
  existingSecret: "keycloak-tls-secret"
  usePEM: true

# Configured NodePort and explicit http listener
service:
  type: NodePort
  http:
    enabled: true
  ports:
    http: 8080
    https: 8443
  nodePorts:
    http: 30280
    https: 30281

http:
  relativePath: "/"

extraEnvVars:
  # Database connection properties
  - name: KEYCLOAK_DATABASE_HOST
    value: postgresql
  - name: KEYCLOAK_DATABASE_NAME
    value: keycloak
  - name: KEYCLOAK_DATABASE_USER
    value: keycloak
  - name: KEYCLOAK_DATABASE_PASSWORD
    value: Wmata1234

  # TLS Certificate locations
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: "/opt/bitnami/keycloak/certs/tls.crt"
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: "/opt/bitnami/keycloak/certs/tls.key"

  # Keycloak 26 Hostname, Proxy & Network fixes (Prevents NodePort redirects to internal IP)
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "false"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "true"

  # Transaction Timeout Fix (Prevents Narayana Reaper ClearExpiredUserSessions crash)
  - name: KEYCLOAK_TRANSACTION_TIMEOUT
    value: "900"
  - name: QUARKUS_TRANSACTION_MANAGER_DEFAULT_TRANSACTION_TIMEOUT
    value: "900s"

  # SPI Truststore Fix (Prevents 'No trust store password provided' boot error)
  - name: KC_SPI_TRUSTSTORE_FILE_PASSWORD
    value: "changeit"
  - name: KC_SPI_TRUSTSTORE_FILE_HOSTNAME_VERIFICATION_POLICY
    value: "ANY"

livenessProbe:
  enabled: true
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

postgresql:
  enabled: true
  fullnameOverride: postgresql
  nameOverride: postgresql
  auth:
    database: keycloak
    username: keycloak
    password: Wmata1234
    postgresPassword: Wmata1234
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: latest
    pullPolicy: IfNotPresent
  primary:
    fullnameOverride: postgresql
    nameOverride: postgresql
    persistence:
      enabled: true
      existingClaim: "data-postgresql-0"
      size: 8Gi
      storageClass: nfs-client

