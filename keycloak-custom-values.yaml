auth:
  adminPassword: Wmata1234
  adminUser: admin

global:
  security:
    allowInsecureImages: true

image:
  pullPolicy: IfNotPresent
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: latest

# Pass direct Quarkus CLI flags to override Bitnami defaults
extraArgs:
  - "--truststore-password=changeit"
  - "--hostname-strict=false"
  - "--http-enabled=true"
  - "--proxy-headers=xforwarded"

production: true

tls:
  enabled: true
  usePEM: true
  autoGenerated:
    enabled: false
  existingSecret: "keycloak-tls-secret"

service:
  type: NodePort
  http:
    enabled: true
  ports:
    http: 8080
    https: 8443
  nodePorts:
    http: 30280
    https: 30281

http:
  relativePath: "/"

extraEnvVars:
  # Database Connection
  - name: KEYCLOAK_DATABASE_HOST
    value: postgresql
  - name: KEYCLOAK_DATABASE_NAME
    value: keycloak
  - name: KEYCLOAK_DATABASE_USER
    value: keycloak
  - name: KEYCLOAK_DATABASE_PASSWORD
    value: Wmata1234

  # TLS Certificate Files
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: "/opt/bitnami/keycloak/certs/tls.crt"
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: "/opt/bitnami/keycloak/certs/tls.key"
  - name: KEYCLOAK_ENABLE_HTTPS
    value: "true"
  - name: KEYCLOAK_HTTPS_PORT
    value: "8443"

  # Fallback Truststore Environment Variables
  - name: KC_SPI_TRUSTSTORE_FILE_PASSWORD
    value: "changeit"
  - name: KC_TRUSTSTORE_PASSWORD
    value: "changeit"
  - name: KEYCLOAK_TRANSACTION_TIMEOUT
    value: "900"

livenessProbe:
  enabled: true
  failureThreshold: 12
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  failureThreshold: 12
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

postgresql:
  enabled: true
  fullnameOverride: postgresql
  auth:
    database: keycloak
    password: Wmata1234
    postgresPassword: Wmata1234
    username: keycloak
  image:
    pullPolicy: IfNotPresent
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: latest
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: nfs-client
