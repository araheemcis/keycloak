auth:
  adminPassword: Wmata1234
  adminUser: admin
extraEnvVars:
- name: KEYCLOAK_DATABASE_HOST
  value: postgresql
- name: KEYCLOAK_DATABASE_NAME
  value: keycloak
- name: KEYCLOAK_DATABASE_USER
  value: keycloak
- name: KEYCLOAK_DATABASE_PASSWORD
  value: Wmata1234

global:
  security:
    allowInsecureImages: true
image:
  pullPolicy: IfNotPresent
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: latest
livenessProbe:
  enabled: true
  failureThreshold: 12
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5

postgresql:
  auth:
    database: keycloak
    password: Wmata1234
    postgresPassword: Wmata1234
    username: keycloak
  enabled: true
  fullnameOverride: postgresql
  image:
    pullPolicy: IfNotPresent
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: latest
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: nfs-client
production: false
readinessProbe:
  enabled: true
  failureThreshold: 12
  initialDelaySeconds: 240
  periodSeconds: 10
  timeoutSeconds: 5
tls:
  enabled: true
  autoGenerated: false
  existingSecret: "keycloak-tls-secret"a
tls:
  enabled: true
  autoGenerated: false
  existingSecret: "keycloak-tls-secret"

service:
  type: NodePort
  ports:
    https: 8443
  nodePorts:
    https: 30280

extraEnvVars:
  - name: KEYCLOAK_PRODUCTION
    value: "true"
  - name: KEYCLOAK_ENABLE_HTTPS
    value: "true"
  - name: KEYCLOAK_HTTPS_PORT
    value: "8443"
